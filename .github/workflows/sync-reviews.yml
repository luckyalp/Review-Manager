name: Stündlicher Bewertungs-Sync

on:
  schedule:
    - cron: '0 * * * *'  # Jede volle Stunde
  workflow_dispatch:       # Auch manuell auslösbar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Reviews
        run: |
          curl -X GET "https://review-manager-mu.vercel.app/api/sync-reviews" \
            --fail \
            --silent \
            --show-error \
            --max-time 30
